server.port=5000

# ── Database ──────────────────────────────────────────────────────────────────
# Default: H2 file database (zero setup). Switch to MySQL with:
#   --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/wiseways
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ── NVIDIA / OpenAI-compatible LLM API ───────────────────────────────────────
nvidia.api.base-url=https://integrate.api.nvidia.com/v1
# NEVER hardcode the key here. Set it as an environment variable instead:
#   Windows (PowerShell):  $env:NVIDIA_API_KEY = "nvapi-..."
#   Windows (Git Bash):    export NVIDIA_API_KEY=nvapi-...
# The app still starts without it; only the /ask chatbot endpoint needs it.
nvidia.api.key=${NVIDIA_API_KEY:}
nvidia.api.model=meta/llama-3.1-8b-instruct

# ── CSV datasets (seeded into the database on first run) ─────────────────────
csv.files=uptac2.csv,JEE_Rank_2016_2024.csv

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.wiseways=INFO
